<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Profile Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-sm w-full bg-slate-800 rounded-2xl shadow-2xl
 border border-slate-700 overflow-hidden
 hover:scale-105 transition-transform duration-600">
        <div class="h-32 bg-gradient-to-r from-cyan-500 to-blue-600
 flex justify-end p-4">
            <span class="bg-slate-900/40 text-white text-xs px-3 py-1
 rounded-full backdrop-blur-sm self-start">
                PRO MEMBER
            </span>
        </div>
        <div class="px-6 pb-6">
            <div class="-mt-16 mb-4 flex justify-center">
                <div class="w-24 h-24 rounded-full bg-cyan-400 p-1 shadow-xl">
                    <div class="w-full h-full bg-slate-800 rounded-full
 flex items-center justify-center text-3xl
 font-bold text-cyan-400">
                        HR
                    </div>
                </div>
            </div>
            <div class="text-center">
                <h2 class="text-xl font-bold text-white mb-1">Habibur Rahman</h2>
                <p class="text-sm text-cyan-400 font-medium mb-3">
                    Full-Stack MERN Developer
                </p>
                <p class="text-xs text-slate-400 mb-6 leading-relaxed">
                    Building scalable web applications, modern UI/UX components,
                    and high-performance frontend interfaces using Tailwind CSS & React.
                </p>
                <div class="flex gap-3">
                    <button class="flex-1 bg-cyan-500 hover:bg-cyan-600
 text-slate-950 font-semibold py-2 px-4
 rounded-xl text-sm transition-colors duration-200">
                        Follow
                    </button>
                    <button class="flex-1 bg-slate-700 hover:bg-slate-600
 text-white font-semibold py-2 px-4 rounded-xl
 text-sm border border-slate-600
 transition-colors duration-200">
                        Message
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
